<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DEVINE capture meter probe</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #12141a; color: #e8e6e0; padding: 24px; }
    h1 { font-size: 1.1rem; letter-spacing: 0.08em; }
    .row { display: flex; gap: 24px; align-items: flex-end; margin: 24px 0; }
    .rail {
      width: 28px; height: 220px; background: #0a0c10; border-radius: 6px;
      border: 1px solid #333; position: relative; overflow: hidden;
    }
    .fill {
      position: absolute; left: 0; right: 0; bottom: 0; height: 4%;
      background: linear-gradient(180deg, #e04030, #e8c030 35%, #40c060);
      transition: height 0.05s linear;
    }
    pre {
      background: #0a0c10; border: 1px solid #333; padding: 12px; border-radius: 8px;
      font-size: 12px; overflow: auto; max-height: 280px;
    }
    .ok { color: #60c080; }
    .bad { color: #f06050; }
    button {
      background: #f07820; color: #1a1008; border: 0; padding: 10px 16px;
      border-radius: 8px; font-weight: 700; cursor: pointer; margin-right: 8px;
    }
    button.secondary { background: #2a2e38; color: #eee; }
  </style>
</head>
<body>
  <h1>CAPTURE METER PROBE</h1>
  <p>Talks only to <code>http://127.0.0.1:8765</code>. No full desk.</p>
  <p id="verdict">Checking bridge…</p>
  <div>
    <button type="button" id="btnStart">Start record</button>
    <button type="button" id="btnStop" class="secondary">Stop</button>
  </div>
  <div class="row">
    <div class="rail"><div class="fill" id="L"></div></div>
    <div class="rail"><div class="fill" id="R"></div></div>
    <div>
      <div>live_peak: <strong id="peak">—</strong></div>
      <div>meter_pct: <strong id="pct">—</strong></div>
      <div>recording: <strong id="rec">—</strong></div>
      <div>build: <strong id="build">—</strong></div>
    </div>
  </div>
  <pre id="raw">{}</pre>
  <script>
    const BRIDGE = "http://127.0.0.1:8765";
    const L = document.getElementById("L");
    const R = document.getElementById("R");
    const verdict = document.getElementById("verdict");

    async function health() {
      const r = await fetch(BRIDGE + "/health", { cache: "no-store" });
      const j = await r.json();
      document.getElementById("build").textContent = j.build || "(missing — OLD BRIDGE)";
      if (j.build === "v1x-meter" || j.has_live_peak) {
        verdict.innerHTML = '<span class="ok">Bridge has live_peak build. Start record and play audio.</span>';
      } else {
        verdict.innerHTML = '<span class="bad">OLD bridge without live_peak. Replace tools/capture_bridge.py and restart.</span>';
      }
      document.getElementById("raw").textContent = JSON.stringify(j, null, 2);
      return j;
    }

    async function poll() {
      try {
        const r = await fetch(BRIDGE + "/status", { cache: "no-store" });
        const j = await r.json();
        const peak = typeof j.live_peak === "number" ? j.live_peak : 0;
        const pct = typeof j.meter_pct === "number" ? j.meter_pct : 0;
        document.getElementById("peak").textContent = peak.toFixed(4);
        document.getElementById("pct").textContent = pct + "%";
        document.getElementById("rec").textContent = String(!!j.recording);
        L.style.height = Math.max(4, pct) + "%";
        R.style.height = Math.max(4, pct) + "%";
        document.getElementById("raw").textContent = JSON.stringify(j, null, 2);
        if (j.recording && pct < 1 && peak < 0.0001) {
          verdict.innerHTML = '<span class="bad">Recording but peak≈0 — wrong device or silence. Play audio on Speakers.</span>';
        } else if (j.recording && pct >= 12) {
          verdict.innerHTML = '<span class="ok">LIVE METER OK — peak and meter_pct moving.</span>';
        }
      } catch (e) {
        verdict.innerHTML = '<span class="bad">Fetch failed: ' + e.message + ' (use http:// page, not file://)</span>';
      }
    }

    document.getElementById("btnStart").onclick = async () => {
      const r = await fetch(BRIDGE + "/record/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: "probe", max_seconds: 120 }),
      });
      const j = await r.json();
      document.getElementById("raw").textContent = JSON.stringify(j, null, 2);
    };
    document.getElementById("btnStop").onclick = async () => {
      const r = await fetch(BRIDGE + "/record/stop", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      const j = await r.json();
      document.getElementById("raw").textContent = JSON.stringify(j, null, 2);
    };

    health().catch((e) => {
      verdict.innerHTML = '<span class="bad">Bridge not reachable: ' + e.message + "</span>";
    });
    setInterval(poll, 80);
  </script>
</body>
</html>
