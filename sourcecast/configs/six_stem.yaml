name: six_stem
stems: [vocals, drums, bass, guitar, piano, other]
device: auto
allow_spectral_fallback: true
output_wav_bit_depth: 24

models:
  - id: htdemucs_6s
    backend: demucs
    name: htdemucs_6s
    enabled: true
  - id: htdemucs_ft
    backend: demucs
    name: htdemucs_ft
    enabled: true
  - id: melband_roformer_kim
    backend: roformer
    architecture: melband_roformer
    checkpoint: melband_roformer_kim_ft_unwa.ckpt
    stems: [vocals]
    enabled: true

chunk:
  seconds: 36
  overlap: 2.5
  window: hann

tta:
  shifts: 1
  shift_seconds: 0.5
  polarity_invert: true
  channel_swap: false
  overlap: 0.25

ensemble:
  method: phase_aware
  residual_other: true
  n_fft: 4096
  hop: 1024
  stem_weights:
    vocals:
      htdemucs_6s: 0.25
      htdemucs_ft: 0.20
      melband_roformer_kim: 0.55
    drums:
      htdemucs_6s: 0.55
      htdemucs_ft: 0.45
    bass:
      htdemucs_6s: 0.55
      htdemucs_ft: 0.45
    guitar:
      htdemucs_6s: 1.0
    piano:
      htdemucs_6s: 1.0
    other:
      htdemucs_6s: 0.6
      htdemucs_ft: 0.4

refine:
  enabled: false
  backend: diffusion
  checkpoint: null
